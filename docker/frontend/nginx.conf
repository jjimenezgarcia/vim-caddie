# SPA fallback: client-side routing (react-router) means /exercises/foo
# is never a real file on disk — without this, refreshing on anything but
# "/" 404s. See src/main.jsx's BrowserRouter.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only this container is published to the host (see docker-compose.yml)
    # — the backend is reached over the internal compose network, never
    # directly by the browser.
    location /ws {
        proxy_pass http://backend:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8765;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
